services:
  postgres:
    image: postgres:16
    container_name: matchmate_postgres
    environment:
      POSTGRES_DB: matchmate_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yesithsri
    ports:
      - "5433:5432"
    volumes:
      - matchmate_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d matchmate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  matchmate_pgdata: